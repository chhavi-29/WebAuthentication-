<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
    }
    form {
        background: white;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        display: flex;
        flex-direction: column;
        gap: 12px;
        width: 280px;
    }
    input {
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
    }
    button {
        padding: 10px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
</style>
</head>
<body>
    <form id="login-form">
        <h2>Log in</h2>
        <input type="text" placeholder="username" id="username" />
        <button type="submit">Login with Passkey</button>
    </form>

    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>

    <script>
        const form = document.getElementById('login-form');
        const usernameField = document.getElementById('username');

        form.addEventListener('submit', async e => {
            e.preventDefault()
            const username = usernameField.value;

            const response = await fetch('/login-challenge', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username })
            })

            const challengeResult = await response.json()

            if (!response.ok) {
                alert(challengeResult.error || 'Something went wrong')
                return
            }

            const { options } = challengeResult // Server side challenge
            const userId = challengeResult.userId

            let authenticationResult
            try {
                authenticationResult = await SimpleWebAuthnBrowser.startAuthentication({ optionsJSON: options })
            } catch (error) {
                alert('Passkey was cancelled or failed')
                return
            }

            console.log(authenticationResult)

            const verifyResponse = await fetch('/login-verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ userId, cred: authenticationResult })
            })

            const verifyResult = await verifyResponse.json()

            if (verifyResult.success) {
                    window.location.replace(`/profile.html?userId=${userId}`)
            } else {
                alert('Login failed')
            }
        })
    </script>
</body>
</html>
