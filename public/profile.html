<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6fb;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
    }
    h1, p {
        text-align: center;
    }
    .buttons {
        display: flex;
        gap: 12px;
    }
    button {
        padding: 10px 20px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
    }
    #logout-btn {
        background: #6b7280;
    }
</style>
</head>
<body>
    <h1>Profile Page</h1>
    <p id="welcome"></p>

   <div class="buttons">
    <button id="register-passkey-btn">Register Passkey</button>
    <button id="logout-btn">Log out</button>
</div>

    <script src="https://unpkg.com/@simplewebauthn/browser/dist/bundle/index.umd.min.js"></script>

    <script>
        // 1. Ask the server who is logged in
        fetch('/me')
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    window.location.replace('/login.html')
                    return
                }
                document.getElementById('welcome').textContent = 'Hello, ' + data.username
            })

        // 2. Log out button
        document.getElementById('logout-btn').addEventListener('click', async () => {
            await fetch('/logout', { method: 'POST' })
            window.location.replace('/login.html')
        })

        // 3. Register Passkey button
        const registerPasskeyBtn = document.getElementById('register-passkey-btn');

        registerPasskeyBtn.addEventListener('click', async () => {
            const response = await fetch('/register-challenge', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            })

            const challengeResult = await response.json()

            if (!response.ok) {
                alert(challengeResult.error || 'Something went wrong')
                return
            }

            const { options } = challengeResult // Server side challenge

            let authenticationResult
            try {
                authenticationResult = await SimpleWebAuthnBrowser.startRegistration({ optionsJSON: options })
            } catch (error) {
                console.log(error)
                alert('Passkey registration was cancelled or failed')
                return
            }

            const verifyResponse = await fetch('/register-verify', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ cred: authenticationResult })
            })

            const verifyResult = await verifyResponse.json()

            if (verifyResult.verified) {
                alert('Passkey registered!')
            } else {
                alert('Passkey registration failed')
            }
        })
    </script>
</body>
</html>
